name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch Linux
            image: archlinux:base-devel
            install: pacman -Syu --noconfirm && pacman -S --noconfirm git fcitx5 fcitx5-qt cmake extra-cmake-modules libxkbcommon gettext qt6-declarative layer-shell-qt
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends ca-certificates build-essential cmake extra-cmake-modules git pkg-config gettext libfcitx5core-dev fcitx5-modules-dev libfcitx5-qt6-dev qt6-base-dev qt6-declarative-dev libxkbcommon-dev liblayershellqtinterface-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true
          - distro: Linux Mint 22
            # Mint 22 ships Ubuntu 24.04 packages plus mint-specific
            # repos. The build only uses Ubuntu-provided libs, so this
            # entry catches Mint-only regressions (renamed packages,
            # im-config drift, /etc/os-release parsing) — the Ubuntu
            # entry above already verifies the toolchain itself. Deps
            # mirror the Ubuntu line including Qt6 Declarative and
            # layer-shell so editor + overlay build the same way.
            image: linuxmintd/mint22-amd64
            install: apt-get update && apt-get install -y --no-install-recommends ca-certificates build-essential cmake extra-cmake-modules git pkg-config gettext libfcitx5core-dev fcitx5-modules-dev libfcitx5-qt6-dev qt6-base-dev qt6-declarative-dev libxkbcommon-dev liblayershellqtinterface-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true
          - distro: Fedora
            image: fedora:42
            install: dnf install -y gcc-c++ make cmake extra-cmake-modules git gettext fcitx5 fcitx5-devel fcitx5-qt-devel qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel libxkbcommon-devel layer-shell-qt-devel
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true
          - distro: openSUSE
            image: opensuse/tumbleweed
            install: zypper --non-interactive install gcc-c++ make cmake extra-cmake-modules git gettext fcitx5 fcitx5-devel fcitx5-qt-devel qt6-base-devel qt6-declarative-devel qt6-quickcontrols2-devel libxkbcommon-devel layer-shell-qt6-devel
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Switch to Azure Ubuntu mirror
        # GitHub Actions runners live on Azure; the Azure-hosted Ubuntu
        # mirror sits in the same datacenter network and is immune to
        # the public archive.ubuntu.com overload that hung CI for 20+
        # minutes today. Content is bit-identical (Canonical-signed
        # .debs) — only the host changes.
        # Ubuntu 24.04 ships sources in DEB822 format under
        # /etc/apt/sources.list.d/ubuntu.sources; legacy
        # /etc/apt/sources.list may also exist. The //-prefix in the
        # match prevents rewriting an already-azure URL on re-runs.
        if: matrix.distro == 'Ubuntu 24.04'
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            [ -f "$f" ] && sed -i \
              -e 's|//archive.ubuntu.com|//azure.archive.ubuntu.com|g' \
              -e 's|//security.ubuntu.com|//azure.archive.ubuntu.com|g' \
              "$f"
          done

      - name: Cache apt archives (Ubuntu)
        if: matrix.distro == 'Ubuntu 24.04'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-ubuntu-24.04-

      - name: Keep downloaded .debs for cache (Ubuntu)
        # apt deletes /var/cache/apt/archives/*.deb after install by default,
        # which would leave the cache empty. Override so the cache action has
        # something to save.
        if: matrix.distro == 'Ubuntu 24.04'
        run: echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/01keep-debs

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Configure
        run: cmake -B build ${{ matrix.cmake_extra }}
        working-directory: addon

      - name: Build
        run: cmake --build build -j$(nproc)
        working-directory: addon

      - name: Verify artifacts
        # Fail the job if any of the three shipped binaries is missing. The
        # overlay daemon in particular can silently skip when LayerShellQt
        # isn't packaged — make that loud rather than a green-but-broken CI.
        run: |
          missing=0
          for f in build/schnelle-umlaute.so \
                   build/editor/schnelle-umlaute-editor \
                   build/overlay/schnelle-umlaute-overlay; do
            if [ -f "$f" ]; then
              echo "ok: $f"
            else
              echo "missing: $f"
              missing=1
            fi
          done
          exit $missing
        working-directory: addon

      - name: Verify shared-library resolution
        # Catches binaries that build but wouldn't start on the user's
        # system because a runtime dep is unresolved. "not found" in ldd
        # output is the signal for a missing .so.
        run: |
          for f in build/editor/schnelle-umlaute-editor \
                   build/overlay/schnelle-umlaute-overlay; do
            echo "=== ldd $f ==="
            ldd "$f"
            if ldd "$f" | grep -q "not found"; then
              echo "unresolved libraries in $f"
              exit 1
            fi
          done
        working-directory: addon

      - name: Smoke test editor (headless)
        # QT_QPA_PLATFORM=offscreen lets Qt create the window without an
        # X/Wayland display. The editor starts, parses all QML, then we
        # kill it after a moment. Any segfault or QML parse error fails
        # the job. The overlay daemon can't run this way — it requires a
        # real Wayland compositor for layer-shell — so we rely on ldd for
        # it above and catch QML errors via the editor run.
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.debug=false;qt.qpa.*=false"
        run: |
          set +e
          # Redirect stderr to a log; ignore exit code from timeout.
          timeout --preserve-status --signal=TERM 3 \
            build/editor/schnelle-umlaute-editor > /tmp/editor.log 2>&1
          ec=$?
          echo "editor exit code: $ec"
          cat /tmp/editor.log
          # 124 = timeout killed it (expected, it runs until we stop it).
          # 143 = SIGTERM from --preserve-status. 0 is also fine if it
          # exits cleanly. SIGSEGV=139 / SIGABRT=134 are always bad.
          case $ec in
            0|124|143) ;;
            *) echo "editor crashed (exit $ec)"; exit 1 ;;
          esac
          if grep -qiE "segmentation fault|sanitizer|assertion failed|qml.*error.*file:" \
             /tmp/editor.log; then
            echo "editor produced errors"; exit 1
          fi
          echo "smoke test passed"
        working-directory: addon

      - name: Test
        if: matrix.run_tests
        run: ctest --test-dir build --output-on-failure
        working-directory: addon

  clang-tidy:
    # Static analysis on production and test C++ sources. Check selection
    # lives in .clang-tidy at the repo root: bugprone-* (real bug patterns),
    # clang-analyzer-* (LLVM's built-in static analyzer), and performance-*
    # excluding enum-size (covered by fcitx5's FCITX_CONFIG_ENUM macro).
    # WarningsAsErrors='*' fails the job on any new finding.
    # Build with Clang (not GCC) so compile_commands.json contains clang-
    # compatible flags only — GCC-only flags like -mno-direct-extern-access
    # would otherwise make clang-tidy reject every translation unit.
    runs-on: ubuntu-24.04
    name: clang-tidy
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        # Same package list as the build matrix's Arch lane plus clang.
        run: pacman -Syu --noconfirm && pacman -S --noconfirm git fcitx5 fcitx5-qt cmake extra-cmake-modules libxkbcommon gettext qt6-declarative layer-shell-qt clang

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Configure with Clang and compile_commands export
        # CMAKE_EXPORT_COMPILE_COMMANDS produces compile_commands.json so
        # clang-tidy sees the exact -I paths and -D defines used in the
        # build. Without it, every Qt6/fcitx5 include would fail to resolve.
        run: cmake -B build -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        working-directory: addon

      - name: Verify code is clang-format clean
        # --dry-run + --Werror: prints diff and exits non-zero if any file
        # would be reformatted. Style is pinned by .clang-format at the
        # repo root. Run before the build so style drift fails fast — no
        # need to compile to find a misformatted file.
        #
        # File list comes from `git ls-files` so newly added .cpp/.h files
        # are picked up automatically — a hardcoded list silently grew out
        # of date as the editor / overlay code expanded.
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

      - name: Build
        # AUTOMOC generates moc_*.cpp for Q_OBJECT classes (editor models,
        # OverlayController). clang-tidy parses these via #include, so the
        # full build has to run before the lint step.
        run: cmake --build build -j$(nproc)
        working-directory: addon

      - name: Run clang-tidy on production and test sources
        # Tests are linted too — bugs in test code (out-of-bound array
        # access, narrowing, dangling stack-pointer escape) can mask real
        # regressions or silently weaken coverage. mappings-io.h is checked
        # via inclusion from both production and test TUs.
        #
        # File list comes from `git ls-files` so newly added .cpp files
        # under addon/ or tests/ are picked up automatically — a hardcoded
        # list silently grew out of date as the editor / overlay code
        # expanded.
        #
        # run-clang-tidy parallelises across TUs (one process per source
        # file). Arguments are matched as regex against the `file` field
        # in compile_commands.json; the relative paths from `git ls-files`
        # match as substrings of the absolute paths CMake stores there.
        # Build-tree autogen sources (moc_*.cpp, ui_*.h) are not tracked
        # by git, so they are excluded automatically.
        run: |
          files=$(git -C .. ls-files 'addon/*.cpp' 'tests/*.cpp')
          run-clang-tidy -p build -j $(nproc) -quiet $files
        working-directory: addon

  install-uninstall:
    # Runs install.sh and uninstall.sh back-to-back inside each distro
    # container, exactly as a real user would. Both scripts refuse to
    # run as root (EUID check), so we create a non-root tester with
    # passwordless sudo and invoke them as that user.
    runs-on: ubuntu-24.04
    name: install + uninstall (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch Linux
            image: archlinux:base-devel
            bootstrap: pacman -Syu --noconfirm sudo
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            bootstrap: apt-get update && apt-get install -y sudo
          - distro: Linux Mint 22
            image: linuxmintd/mint22-amd64
            bootstrap: apt-get update && apt-get install -y sudo
          - distro: Fedora
            image: fedora:42
            bootstrap: dnf install -y sudo
          - distro: openSUSE
            image: opensuse/tumbleweed
            bootstrap: zypper --non-interactive install sudo

    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - name: Bootstrap sudo
        run: ${{ matrix.bootstrap }}

      - name: Create tester user with passwordless sudo
        # env_keep += DEBIAN_FRONTEND so the noninteractive flag reaches
        # the `sudo apt install` calls inside install.sh — otherwise
        # tzdata's postinst prompts for a timezone and `yes | ...` loops
        # forever feeding "y" to a question that expects a number.
        #
        # root ALL=... is needed for openSUSE Tumbleweed: its default
        # /etc/sudoers ships without root's privilege spec, so the outer
        # `sudo -u tester ...` fails with "root is not in the sudoers
        # file" even though we are already running as root.
        run: |
          useradd -m -s /bin/bash tester
          echo "root   ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          echo "tester ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          echo 'Defaults env_keep += "DEBIAN_FRONTEND"' >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Hand checkout to tester
        run: chown -R tester:tester "$GITHUB_WORKSPACE"

      - name: Run install.sh
        # `yes` answers every "Y/n" prompt with y. DEBIAN_FRONTEND is
        # kept for Ubuntu's tzdata debconf during apt install.
        run: sudo -u tester bash -c "export DEBIAN_FRONTEND=noninteractive && cd '$GITHUB_WORKSPACE' && yes | ./install.sh"

      - name: Verify installed files
        # v1.2.0 ships the fcitx5 addon plus two standalone Qt6 binaries
        # (editor, overlay daemon) and their XDG/DBus integration files.
        # libschnelle-umlaute-config-editor.so is NOT shipped anymore —
        # it only appears in STALE_CANDIDATES so upgraders from v1.0/1.1
        # get the obsolete plugin removed.
        run: |
          echo "=== addon .so ==="
          find /usr /usr/local -name 'schnelle-umlaute.so' 2>/dev/null
          echo "=== editor binary ==="
          find /usr /usr/local -name 'schnelle-umlaute-editor' -type f 2>/dev/null
          echo "=== overlay binary ==="
          find /usr /usr/local -name 'schnelle-umlaute-overlay' -type f 2>/dev/null
          echo "=== desktop + icon ==="
          find /usr /usr/local -name 'schnelle-umlaute-editor.desktop' 2>/dev/null
          find /usr /usr/local -name 'schnelle-umlaute-editor.svg' 2>/dev/null
          echo "=== DBus service + autostart ==="
          find /usr /usr/local /etc -name 'de.schnelle_umlaute.Overlay.service' 2>/dev/null
          find /usr /usr/local /etc -name 'schnelle-umlaute-overlay.desktop' 2>/dev/null
          echo "=== addon metadata ==="
          find /usr /usr/local -name 'schnelle-umlaute.conf*' 2>/dev/null

          fail=0
          check() {
            local label="$1"
            shift
            if ! "$@" | grep -q .; then
              echo "FAIL: $label was not installed"
              fail=1
            fi
          }
          check "addon .so"       find /usr /usr/local -name 'schnelle-umlaute.so' 2>/dev/null
          check "editor binary"   find /usr /usr/local -name 'schnelle-umlaute-editor' -type f 2>/dev/null
          check "overlay binary"  find /usr /usr/local -name 'schnelle-umlaute-overlay' -type f 2>/dev/null
          check "editor .desktop" find /usr /usr/local -name 'schnelle-umlaute-editor.desktop' 2>/dev/null
          check "DBus .service"   find /usr /usr/local /etc -name 'de.schnelle_umlaute.Overlay.service' 2>/dev/null
          exit $fail

      - name: Smoke test installed editor (headless)
        # Validates the install.sh package list at runtime, not just at
        # build time. A crash here means an end user would see the editor
        # crash on first launch — usually a missing QML module that the
        # build job didn't catch because that job uses ci.yml's richer
        # package list while end users get install.sh's leaner one.
        # Same offscreen-platform trick as the build job; the editor
        # doesn't exit on its own, so timeout kills it after a moment.
        # Locate via find rather than PATH because install prefixes
        # differ across distros (/usr/bin on Fedora/openSUSE,
        # /usr/local/bin on Arch/Debian via cmake default).
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.debug=false;qt.qpa.*=false"
        run: |
          set +e
          EDITOR=$(find /usr /usr/local -name 'schnelle-umlaute-editor' -type f 2>/dev/null | head -1)
          if [ -z "$EDITOR" ]; then
            echo "FAIL: schnelle-umlaute-editor not found"
            exit 1
          fi
          echo "running $EDITOR"
          timeout --preserve-status --signal=TERM 3 "$EDITOR" > /tmp/editor.log 2>&1
          ec=$?
          echo "editor exit code: $ec"
          cat /tmp/editor.log
          case $ec in
            0|124|143) ;;
            *) echo "editor crashed (exit $ec)"; exit 1 ;;
          esac
          if grep -qiE "segmentation fault|sanitizer|assertion failed|qml.*error.*file:" \
             /tmp/editor.log; then
            echo "editor produced errors"; exit 1
          fi
          echo "smoke test passed"

      - name: Run uninstall.sh
        # uninstall.sh uses [y/N] prompts (default N), so `yes` feeds "y"
        # to remove everything. Last step tries to restart fcitx5 —
        # no-op in a container without a display server, swallowed by
        # 2>/dev/null in the script.
        run: sudo -u tester bash -c "cd '$GITHUB_WORKSPACE' && yes | ./uninstall.sh"

      - name: Verify files removed
        # Inverse of the install verification for every v1.2.0 artifact.
        # A hit here means uninstall.sh's LIB_PATHS / DATA_FILES drifted
        # from install.sh's install targets — the cycle then leaves
        # files on the user's system after uninstall.
        run: |
          remaining=0
          for pattern in 'schnelle-umlaute.so' \
                         'libschnelle-umlaute-config-editor.so' \
                         'schnelle-umlaute-editor' \
                         'schnelle-umlaute-overlay' \
                         'schnelle-umlaute-editor.desktop' \
                         'schnelle-umlaute-editor.svg' \
                         'schnelle-umlaute-overlay.desktop' \
                         'de.schnelle_umlaute.Overlay.service' \
                         'schnelle-umlaute.conf' \
                         'schnelle-umlaute.conf.in' \
                         'org.fcitx.Fcitx5.Addon.SchnelleUmlaute.metainfo.xml'; do
            hits=$(find /usr /usr/local /etc -name "$pattern" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "FAIL: $pattern still present after uninstall:"
              echo "$hits"
              remaining=1
            fi
          done
          if [ $remaining -eq 0 ]; then
            echo "ok: all artifacts removed"
          fi
          exit $remaining

  scripts:
    runs-on: ubuntu-24.04
    name: Lint install/uninstall scripts
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install shellcheck
        # Download the static binary from upstream releases instead of
        # apt — apt on the ubuntu-24.04 runner occasionally hangs for
        # minutes on a slow mirror, which this job doesn't need.
        run: |
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo mv /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/
          shellcheck --version

      - name: shellcheck
        # Only errors fail the job — warnings (like SC2086 word splitting)
        # would flag too much style.
        run: shellcheck --severity=error install.sh uninstall.sh addon/build.sh
