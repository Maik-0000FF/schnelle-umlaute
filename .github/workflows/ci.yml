name: CI

on:
  push:
    branches: [main, dev, refactor/decompose-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    name: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch Linux
            image: archlinux:base-devel
            install: pacman -Syu --noconfirm && pacman -S --noconfirm git fcitx5 fcitx5-qt cmake extra-cmake-modules libxkbcommon gettext qt6-declarative layer-shell-qt
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update && apt-get install -y build-essential cmake extra-cmake-modules git pkg-config gettext libfcitx5core-dev fcitx5-modules-dev libfcitx5-qt6-dev qt6-base-dev qt6-declarative-dev libxkbcommon-dev liblayershellqtinterface-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true
          - distro: Fedora
            image: fedora:42
            install: dnf install -y gcc-c++ make cmake extra-cmake-modules git gettext fcitx5 fcitx5-devel fcitx5-qt-devel qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel libxkbcommon-devel layer-shell-qt-devel
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true
          - distro: openSUSE
            image: opensuse/tumbleweed
            install: zypper --non-interactive install gcc-c++ make cmake extra-cmake-modules git gettext fcitx5 fcitx5-devel fcitx5-qt-devel qt6-base-devel qt6-declarative-devel qt6-quickcontrols2-devel libxkbcommon-devel layer-shell-qt6-devel
            cmake_extra: -DBUILD_TESTING=ON
            run_tests: true

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Configure
        run: cmake -B build ${{ matrix.cmake_extra }}
        working-directory: addon

      - name: Build
        run: cmake --build build -j$(nproc)
        working-directory: addon

      - name: Verify artifacts
        # Fail the job if any of the three shipped binaries is missing. The
        # overlay daemon in particular can silently skip when LayerShellQt
        # isn't packaged — make that loud rather than a green-but-broken CI.
        run: |
          missing=0
          for f in build/schnelle-umlaute.so \
                   build/editor/schnelle-umlaute-editor \
                   build/overlay/schnelle-umlaute-overlay; do
            if [ -f "$f" ]; then
              echo "ok: $f"
            else
              echo "missing: $f"
              missing=1
            fi
          done
          exit $missing
        working-directory: addon

      - name: Verify shared-library resolution
        # Catches binaries that build but wouldn't start on the user's
        # system because a runtime dep is unresolved. "not found" in ldd
        # output is the signal for a missing .so.
        run: |
          for f in build/editor/schnelle-umlaute-editor \
                   build/overlay/schnelle-umlaute-overlay; do
            echo "=== ldd $f ==="
            ldd "$f"
            if ldd "$f" | grep -q "not found"; then
              echo "unresolved libraries in $f"
              exit 1
            fi
          done
        working-directory: addon

      - name: Smoke test editor (headless)
        # QT_QPA_PLATFORM=offscreen lets Qt create the window without an
        # X/Wayland display. The editor starts, parses all QML, then we
        # kill it after a moment. Any segfault or QML parse error fails
        # the job. The overlay daemon can't run this way — it requires a
        # real Wayland compositor for layer-shell — so we rely on ldd for
        # it above and catch QML errors via the editor run.
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.debug=false;qt.qpa.*=false"
        run: |
          set +e
          # Redirect stderr to a log; ignore exit code from timeout.
          timeout --preserve-status --signal=TERM 3 \
            build/editor/schnelle-umlaute-editor > /tmp/editor.log 2>&1
          ec=$?
          echo "editor exit code: $ec"
          cat /tmp/editor.log
          # 124 = timeout killed it (expected, it runs until we stop it).
          # 143 = SIGTERM from --preserve-status. 0 is also fine if it
          # exits cleanly. SIGSEGV=139 / SIGABRT=134 are always bad.
          case $ec in
            0|124|143) ;;
            *) echo "editor crashed (exit $ec)"; exit 1 ;;
          esac
          if grep -qiE "segmentation fault|sanitizer|assertion failed|qml.*error.*file:" \
             /tmp/editor.log; then
            echo "editor produced errors"; exit 1
          fi
          echo "smoke test passed"
        working-directory: addon

      - name: Test
        if: matrix.run_tests
        run: ctest --test-dir build --output-on-failure
        working-directory: addon

  scripts:
    runs-on: ubuntu-24.04
    name: Lint install/uninstall scripts
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        # Warnings don't fail the job, errors do. SC2086 (word splitting)
        # is common enough to disable unless we hit a real bug.
        run: shellcheck --severity=error install.sh uninstall.sh
